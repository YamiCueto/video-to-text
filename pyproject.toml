[project]
name = "video-to-text"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai-whisper==20250625",
    "torch==2.11.0",
    "yt-dlp==2026.8.19",
    "yt-dlp-ejs==0.8.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "ruff",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
